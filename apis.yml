aid: synconset-technologies
name: SyncOnSet Technologies
description: >-
  SyncOnSet Technologies is an Emmy Award-winning digital continuity, inventory,
  and money-tracking platform for film and television production, now part of
  Entertainment Partners. It replaces paper continuity binders with a
  collaborative online/offline web and mobile app that manages automatic script
  breakdowns and revisions, continuity photos, costume and wardrobe pieces, hair
  and makeup looks, props, set decoration, and locations, alongside per-character
  and per-scene budgeting and asset reports from prep through wrap. SyncOnSet is
  a login-gated SaaS application (production teams access it by account) and
  exposes no public developer API, OpenAPI, or self-serve developer program, so
  this profile captures its identity, published web properties, and a
  domain-security probe rather than API artifacts.
